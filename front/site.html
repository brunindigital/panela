<script>
(function(){
  var c=document.getElementById('lv-carousel');
  if(!c) return;
  var section=c.closest('[data-carousel]');
  var slides=c.querySelector('.flex')?c.querySelector('.flex').children:[];
  var n=slides.length;
  function mk(cls,html,onclick){var b=document.createElement('button');b.className=cls;b.innerHTML=html;b.type='button';b.addEventListener('click',onclick);return b;}
  var prev=mk('lv-arrow prev','<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>',function(){c.scrollBy({left:-c.clientWidth,behavior:'smooth'});});
  var next=mk('lv-arrow next','<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',function(){c.scrollBy({left:c.clientWidth,behavior:'smooth'});});
  section.appendChild(prev);section.appendChild(next);
  var dots=document.createElement('div');dots.className='lv-dots';
  for(var i=0;i<n;i++){(function(i){var d=document.createElement('button');d.className='lv-dot'+(i===0?' active':'');d.type='button';d.addEventListener('click',function(){c.scrollTo({left:i*c.clientWidth,behavior:'smooth'});});dots.appendChild(d);})(i);}
  section.appendChild(dots);
  c.addEventListener('scroll',function(){
    var idx=Math.round(c.scrollLeft/c.clientWidth);
    Array.prototype.forEach.call(dots.children,function(d,k){d.classList.toggle('active',k===idx);});
  });
})();
</script>

<script>
(function(){
  var modal=document.getElementById('preco-modal');
  var btn=document.getElementById('lv-price-details');
  if(!modal||!btn) return;
  var ORIG=436.99;
  function fmt(n){return 'R$ '+n.toFixed(2).replace('.',',');}
  function precoAtual(){
    var sel=document.querySelector('#cor-modal .cm-opt.sel');
    var p=sel?parseFloat(sel.getAttribute('data-preco')):NaN;
    if(isNaN(p)||p<=0){ try{p=parseFloat(localStorage.getItem('precoSelecionado')||'');}catch(e){} }
    if(isNaN(p)||p<=0) p=67.90;
    return p;
  }
  btn.addEventListener('click',function(){
    var p=precoAtual();
    var desc=Math.max(ORIG-p,0);
    document.getElementById('pm-orig').textContent=fmt(ORIG);
    document.getElementById('pm-desc').textContent='-'+fmt(desc);
    document.getElementById('pm-atual').textContent=fmt(p);
    modal.classList.add('open');
  });
  modal.addEventListener('click',function(e){
    if(e.target.closest('[data-pm-close]')) modal.classList.remove('open');
  });
})();
</script>
<script>
(function(){
  var modal=document.getElementById('cor-modal');
  var cta=document.getElementById('cm-continue');
  var elPrice=document.getElementById('cm-price');
  var elName=document.getElementById('cm-selname');
  var elThumb=document.getElementById('cm-thumb');
  var optionsTrigger=document.getElementById('lv-options-trigger');
  var dest=location.protocol==='file:' ? '../checkout/pagamento.html' : '/checkout';
  var picked={};   // chave -> {cor,nome,preco,img,qty}
  function keyOf(b){ return b.getAttribute('data-nome'); }
  function dataOf(b){
    return { cor:b.getAttribute('data-cor'), nome:b.getAttribute('data-nome'),
             preco:Number(b.getAttribute('data-preco')), img:b.getAttribute('data-img') };
  }
  function list(){ return Object.keys(picked).map(function(k){ return picked[k]; }); }
  function money(n){ return Number(n).toFixed(2).replace('.',','); }
  function refresh(){
    var itens=list(), tot=0, un=0;
    itens.forEach(function(i){ tot+=i.preco*i.qty; un+=i.qty; });
    var current = itens.length ? itens[itens.length - 1] : null;
    elPrice.textContent=money(tot||0);
    if(current && current.img){ elThumb.src=current.img; elThumb.alt='Conjunto culinário - '+current.nome; }
    elName.textContent=itens.length?itens.map(function(i){ return i.nome+(i.qty>1?' ('+i.qty+'x)':''); }).join(', '):'nenhuma';
    cta.querySelector('strong').textContent=un>1?('Comprar '+un+' kits agora'):'Comprar agora';
    cta.disabled=!itens.length;
    cta.style.opacity=itens.length?'1':'.55';
    modal.querySelectorAll('.cm-opt').forEach(function(b){
      var d=picked[keyOf(b)];
      b.classList.toggle('sel',!!d);
      var q=b.querySelector('.cm-qty b'); if(q&&d) q.textContent=String(d.qty);
    });
  }
  function open(d){dest=d||'/checkout';modal.classList.add('open');document.body.style.overflow='hidden';}
  function close(){modal.classList.remove('open');document.body.style.overflow='';}
  function trackingQuery(){
    var params=new URLSearchParams();
    ['src','sck','utm_source','utm_campaign','utm_medium','utm_content','utm_term'].forEach(function(key){
      var value=new URLSearchParams(location.search).get(key);
      if(value!==null) params.set(key,value);
    });
    return params.toString();
  }
  if(optionsTrigger){ optionsTrigger.addEventListener('click',function(ev){ ev.preventDefault(); ev.stopPropagation(); open('/checkout'); }); }
  document.querySelectorAll('a[href*="/checkout"]').forEach(function(link){
    link.addEventListener('click',function(ev){ ev.preventDefault(); ev.stopPropagation(); open('/checkout'); });
  });
  function toLocalFileRoute(url){
    if(location.protocol!=='file:') return url;
    var parts=url.split('?');
    var path=parts[0]||'';
    var query=parts[1]?('?'+parts.slice(1).join('?')):'';
    var map={
      '/checkout':'../checkout/pagamento.html',
      '/checkout/':'../checkout/pagamento.html',
      '/upsell1':'../upsell1/upsell1.html',
      '/upsell2':'../upsell2/upsell2.html',
      '/upsell3':'../upsell3/upsell3.html',
      '/upsell4':'../upsell4/upsell4.html'
    };
    if(map[path]) return map[path]+query;
    return path + query;
  }
  modal.querySelectorAll('[data-cm-close]').forEach(function(el){el.addEventListener('click',close);});
  modal.querySelectorAll('.cm-opt').forEach(function(b){
    b.addEventListener('click',function(ev){
      var step=ev.target&&ev.target.closest?ev.target.closest('[data-q]'):null;
      var k=keyOf(b);
      if(step){
        ev.stopPropagation();
        var d=picked[k];
        if(!d) return;
        if(step.getAttribute('data-q')==='+'){ d.qty=Math.min(10,d.qty+1); }
        else { d.qty-=1; if(d.qty<1) delete picked[k]; }
      } else if(picked[k]){ delete picked[k]; }
      else { var nd=dataOf(b); nd.qty=1; picked[k]=nd; }
      refresh();
    });
  });
  // Baunilha pré-selecionada
  (function(){ var f=modal.querySelector('.cm-opt'); if(f){ var d=dataOf(f); d.qty=1; picked[keyOf(f)]=d; } refresh(); })();

  cta.addEventListener('click',function(){
    var itens=list();
    if(!itens.length)return;
    var totalSelecionado=itens.reduce(function(sum,i){ return sum+(Number(i.preco)||0)*(Number(i.qty)||1); },0);
    var kits=itens.map(function(i){ return i.nome+':'+i.qty+':'+i.preco.toFixed(2); }).join('|');
    try{
      var active = itens[itens.length - 1] || itens[0];
      localStorage.setItem('kitsSelecionados',JSON.stringify(itens));
      localStorage.setItem('corSelecionada',active ? active.cor : itens[0].cor);
      localStorage.setItem('precoSelecionado',totalSelecionado.toFixed(2));
      localStorage.removeItem('pedidoResumo');
    }catch(e){}
    cta.querySelector('strong').textContent='Carregando checkout...';
    var attribution=trackingQuery();
    var url=dest+(dest.indexOf('?')>-1?'&':'?')+'cor='+encodeURIComponent(itens[0].cor)
      +'&preco='+encodeURIComponent(totalSelecionado.toFixed(2))
      +'&kits='+encodeURIComponent(kits)+(attribution?'&'+attribution:'');
    go(url);
  });
  function go(url){
    url = toLocalFileRoute(url);
    // tenta o topo, depois o pai (preview), e por fim a própria janela
    try{ if(window.top&&window.top!==window){ window.top.location.href=url; return; } }catch(e){}
    try{ if(window.parent&&window.parent!==window){ window.parent.location.href=url; return; } }catch(e){}
    try{ window.location.assign(url); return; }catch(e){}
    var a=document.createElement('a');a.href=url;a.target='_top';document.body.appendChild(a);a.click();
  }
  // delegação: pega qualquer link/botão de checkout, inclusive os renderizados depois
  document.addEventListener('click',function(e){
    var t=e.target&&e.target.closest?e.target.closest('a[href*="/checkout"],[data-checkout],button[aria-label="Carrinho"]'):null;
    if(!t)return;
    if(modal.contains(t))return;
    e.preventDefault();e.stopPropagation();
    open('/checkout');
  },true);
})();
</script>
<script>
(function(){
  var KEY='cm_flash_target_v1';
  var el=document.getElementById('cm-flash-timer');
  function pad(n){ return n<10?'0'+n:n; }
  var t;
  try{ t=parseInt(localStorage.getItem(KEY),10); }catch(e){}
  if(!t || t<Date.now()){ t=Date.now()+7*60*1000; try{ localStorage.setItem(KEY,t); }catch(e){} }
  function tick(){
    var diff=Math.max(0,t-Date.now());
    var h=Math.floor(diff/3600000);
    var m=Math.floor((diff%3600000)/60000);
    var s=Math.floor((diff%60000)/1000);
    if(el) el.textContent=pad(h)+':'+pad(m)+':'+pad(s);
  }
  tick();
  setInterval(tick,1000);
})();
</script>

    <div><h4>Suporte Inox Home Online</h4><p><i></i>Atendimento com IA · online agora</p></div>

    <button type="submit" id="sup-send" aria-label="Enviar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"></path></svg></button>
  </form>

<script>
(function(){
  var btn=document.getElementById('sup-btn'),panel=document.getElementById('sup-panel'),
      msgs=document.getElementById('sup-msgs'),form=document.getElementById('sup-form'),
      input=document.getElementById('sup-input'),send=document.getElementById('sup-send'),
      quick=document.getElementById('sup-quick'),busy=false,history=[],started=false;
  function bubble(text,who){var d=document.createElement('div');d.className='sup-m '+who;d.textContent=text;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d;}
  function typing(){var d=document.createElement('div');d.className='sup-typing';d.innerHTML='<span></span><span></span><span></span>';msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d;}
  function greet(){
    if(started)return;started=true;
    bubble('Olá! 👋 Sou o suporte da Inox Home Online. Posso te ajudar com prazo de entrega, pagamento, cores do kit, rastreio e trocas. Qual é a sua dúvida?','bot');
  }
  function open(){panel.classList.add('open');btn.style.display='none';greet();setTimeout(function(){input.focus();},80);}
  function close(){panel.classList.remove('open');btn.style.display='flex';}
  btn.addEventListener('click',open);
  document.getElementById('sup-close').addEventListener('click',close);
  quick.addEventListener('click',function(e){var b=e.target.closest('button');if(b)ask(b.textContent);});
  form.addEventListener('submit',function(e){e.preventDefault();ask(input.value);});
  function ask(text){
    text=(text||'').trim();
    if(!text||busy)return;
    input.value='';busy=true;send.disabled=true;
    bubble(text,'me');
    history.push({role:'user',content:text});
    var t=typing();
    fetch('/api/public/support/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})})
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
      .then(function(res){
        t.remove();
        if(res.ok&&res.j&&res.j.reply){history.push({role:'assistant',content:res.j.reply});bubble(res.j.reply,'bot');}
        else if(res.j&&res.j.error==='rate_limited'){bubble('Muitas mensagens agora. Aguarde alguns segundos e tente novamente.','bot');}
        else{bubble('Não consegui responder agora. Tente novamente em instantes ou responda o e-mail da sua compra que nossa equipe te ajuda.','bot');}
      })
      .catch(function(){t.remove();bubble('Falha de conexão. Verifique sua internet e tente novamente.','bot');})
      .finally(function(){busy=false;send.disabled=false;input.focus();});
  }
})();
</script>

<script>
/* Janela de entrega dinamica: sempre a partir de amanha (hoje+1 a hoje+8) */
(function(){
  var MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  function janela(a,b){
    var h=new Date();
    var d1=new Date(h.getTime()+a*86400000), d2=new Date(h.getTime()+b*86400000);
    if(d1.getMonth()===d2.getMonth()) return d1.getDate()+' a '+d2.getDate()+' de '+MESES[d2.getMonth()];
    return d1.getDate()+' de '+MESES[d1.getMonth()]+' a '+d2.getDate()+' de '+MESES[d2.getMonth()];
  }
  function apply(){
    var el=document.getElementById('lv-prazo-entrega');
    if(el){ var t='Chegará entre '+janela(1,8); if(el.textContent!==t) el.textContent=t; }
  }
  apply();
  document.addEventListener('DOMContentLoaded',apply);
  setInterval(apply,60000);
  try{ new MutationObserver(apply).observe(document.body,{childList:true,subtree:true}); }catch(e){}
})();
</script>

<div id="lv-return-modal" class="lv-return-modal" aria-hidden="true" role="dialog" aria-label="Como devolver">
  <div class="lv-return-backdrop" data-lv-return-close=""></div>

      <button type="button" class="lv-return-x" data-lv-return-close="" aria-label="Fechar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>

    <div class="lv-return-body">
      <div class="lv-return-section">
        <h4>Como inicio uma devolução?</h4>
        <p>A menos que seu produto não possa ser devolvido, você pode solicitar uma devolução no TikTok dentro de 30 dias após a entrega. Ou entre em contato com a equipe de Atendimento ao Cliente para problemas de qualidade do produto dentro de 90 dias após a entrega.</p>
        <p>Você não precisa entrar em contato diretamente com o vendedor antes de solicitar uma devolução a ele. Basta seguir os passos abaixo:</p>
        <div class="lv-return-step"><strong>Passo 1</strong> Encontre seu pedido</div>
        <p>Navegue até a guia Perfil, selecione "Seus pedidos" e depois a guia "Pedidos" para ver todos os seus pedidos. Selecione o que você deseja devolver.</p>
        <div class="lv-return-step"><strong>Passo 2</strong> Solicite a devolução</div>
        <p>Clique em "Devolver itens" na página Detalhes do Pedido. Selecione o motivo que melhor se adapta à sua situação e inclua qualquer prova relevante, antes de enviar sua solicitação.</p>
        <p>Se o item que você comprou não for passível de devolução, você verá um botão "Solicitar reembolso".</p>
      </div>
      <div class="lv-return-section">
        <h4>Como eu devolvo meu produto?</h4>
        <p>Certifique-se de que o item e a quantidade corretos estão embalados com segurança na condição original. Remova quaisquer outras etiquetas de rastreamento do lado de fora da embalagem. Existem duas maneiras de devolver o seu produto, e a disponibilidade de cada uma pode depender do produto em questão. Use a opção fornecida quando solicitar a devolução:</p>
        <p><strong>Opção de envio por conta própria:</strong> Entre em contato com o seu serviço de courier/logística preferido para enviar seu pacote às suas próprias custas. Guarde suas informações de rastreamento para fornecer ao TikTok.</p>
        <p><strong>Opção de devolução em ponto de coleta:</strong> O TikTok Shop fornecerá a você uma etiqueta pré-paga para sua devolução.</p>
        <p>Os reembolsos serão processados após a sua devolução chegar ao vendedor e ele revisar o estado do item.</p>
      </div>
      <div class="lv-return-section">
        <h4>Quanto tempo levará meu reembolso?</h4>
        <p>Isso dependerá do método de pagamento original utilizado quando você fez seu pedido. Os reembolsos normalmente são processados:</p>
        <ul>
          <li><strong>Cartão de crédito/débito:</strong> geralmente dentro de 2-14 dias úteis</li>
          <li><strong>Transferência bancária:</strong> instantaneamente</li>
          <li><strong>Pagamento em dinheiro:</strong> você precisará inserir sua conta bancária ao iniciar o pedido de reembolso. Após isso, o tempo de processamento do banco pode variar para você receber o reembolso, geralmente entre 2 a 14 dias úteis. Ou, informe sua conta Pix para receber em 1 dia útil.</li>
        </ul>
        <p>Você também pode checar o progresso de seu reembolso em sua página de Detalhes do Pedido.</p>
      </div>

      <div class="lv-return-section lv-return-lang">
        <h4>How do I start a return?</h4>
        <p>Unless your product is one that can not be returned, you can request a return on TikTok within 30 days of delivery. Or, contact the Customer Service team for product quality issues within 90 days of delivery.</p>
        <p>You do not need to contact the seller directly before requesting a return with them. Simply follow the steps below:</p>
        <div class="lv-return-step"><strong>Step 1</strong> Find your order</div>
        <p>Navigate to the Profile tab, select "Your orders" and then the "Orders" tab to view all your orders. Select the one that you want to return.</p>
        <div class="lv-return-step"><strong>Step 2</strong> Request a return</div>
        <p>Click "Return items" on the Order Details page. Select the reason that best suits your situation and include any relevant proof, before submitting your request.</p>
        <p>If the item you purchased is not returnable, you will see a "Request refund" button instead.</p>
      </div>
      <div class="lv-return-section lv-return-lang">
        <h4>How do I return my product?</h4>
        <p>Ensure the correct item and quantity are securely packed in original condition. Remove any other tracking labels from the outside of the packaging. There are two ways to return your product, whichever is available to this product may depend. Please use the provided option when you apply for the return:</p>
        <p><strong>Self-arranged option:</strong> Contact your preferred courier to ship your parcel at your own expense. Keep your tracking information to provide to TikTok.</p>
        <p><strong>Drop-off option:</strong> TikTok Shop will provide you with a pre-paid label for your return.</p>
        <p>Refunds will be processed after your return arrives with the seller and they've reviewed its condition.</p>
      </div>
      <div class="lv-return-section lv-return-lang">
        <h4>How long will my refund take?</h4>
        <p>This will depend on the original payment method used when you placed your order. Refunds will typically arrive:</p>

        </ul>
        <p>You can also check the progress of your refund on your Order Details page.</p>
      </div>
    </div>

<script>
(function(){
  var countEl=document.getElementById('lv-stock-count');
  if(!countEl) return;
  var MIN=1, START=49, INTERVAL=12000;
  var key='lv_stock_count_v1';
  var startedAtKey='lv_stock_started_v1';
  function now(){ return Date.now(); }
  function readCount(){
    try{
      var s=sessionStorage.getItem(startedAtKey);
      var start=s?parseInt(s,10):null;
      if(!start || isNaN(start) || start>now() || now()-start>24*60*60*1000){
        sessionStorage.setItem(startedAtKey,String(now()));
        sessionStorage.setItem(key,String(START));
        return START;
      }
      var c=parseInt(sessionStorage.getItem(key)||String(START),10);
      var elapsed=now()-start;
      var drops=Math.floor(elapsed/INTERVAL);
      var val=Math.max(MIN,START-drops);
      sessionStorage.setItem(key,String(val));
      return val;
    }catch(e){ return START; }
  }
  function setText(n){ countEl.textContent=String(n); }
  function tickDown(){
    var current=parseInt(countEl.textContent,10);
    if(isNaN(current) || current<=MIN) return;
    var next=current-1;
    countEl.classList.add('is-leaving');
    setTimeout(function(){
      setText(next);
      try{ sessionStorage.setItem(key,String(next)); }catch(e){}
      countEl.classList.remove('is-leaving');
      countEl.classList.add('is-entering');
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          countEl.classList.remove('is-entering');
        });
      });
    }, 350);
  }
  setText(readCount());
  setInterval(tickDown, INTERVAL);
})();
</script>
