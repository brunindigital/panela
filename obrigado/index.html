<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pedido confirmado</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a; }
      main { width: min(440px, calc(100% - 40px)); padding: 36px 24px; text-align: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 18px; box-shadow: 0 12px 35px rgba(15, 23, 42, .08); }
      .check { width: 64px; height: 64px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 50%; background: #dcfce7; color: #15803d; font-size: 34px; font-weight: 700; }
      h1 { margin: 0 0 12px; font-size: 26px; }
      p { margin: 0; color: #475569; line-height: 1.55; }
    </style>
  </head>
  <body>
    <main>
      <div class="check" aria-hidden="true">✓</div>
      <h1>Pedido confirmado</h1>
      <p>Todos os pagamentos foram processados. Obrigado pela sua compra.</p>
    </main>
  </body>
</html>
